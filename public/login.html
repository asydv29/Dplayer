<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in • D Player</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#0f0f0f;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.auth-wrap{width:100%;max-width:420px}.card{background:#181818;border:1px solid #2b2b2b;border-radius:18px;padding:30px;box-shadow:0 18px 60px #0008;animation:mtCardIn .45s cubic-bezier(.22,1,.36,1)}
.brand{display:flex;justify-content:center;align-items:center;min-height:54px;margin-bottom:18px}.brand img{max-width:190px;max-height:58px;object-fit:contain}
h1{text-align:center;font-size:24px;margin:8px 0 6px}.sub{text-align:center;color:#aaa;font-size:14px;margin:0 0 24px}
label{display:block;font-size:13px;color:#ddd;margin:0 0 7px}
.field{position:relative;margin-bottom:16px}.field input{margin:0}
input{width:100%;height:48px;border:1px solid #444;background:#0f0f0f;color:#fff;border-radius:10px;padding:0 48px 0 13px;font-size:15px;outline:none;transition:border-color .15s}
input:focus{border-color:#aaa}.toggle{position:absolute;right:5px;top:5px;width:38px;height:38px;background:transparent;color:#aaa;border:0;font-size:18px;padding:0;cursor:pointer}
button{width:100%;height:48px;border:0;border-radius:10px;background:#fff;color:#111;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s}
button:active{transform:scale(.98)}
button:disabled{opacity:.55;cursor:wait}
.divider{display:flex;align-items:center;gap:10px;color:#777;font-size:12px;margin:20px 0}.divider:before,.divider:after{content:"";height:1px;background:#333;flex:1}
.google{background:#272727;color:#fff;border:1px solid #444}
.switch{text-align:center;color:#aaa;font-size:14px;margin:20px 0 0}.switch a,.link{color:#fff;text-decoration:none;font-weight:700}
.back{display:block;text-align:center;color:#888;text-decoration:none;font-size:13px;margin-top:18px}
.msg{display:none;margin:0 0 15px;padding:10px 12px;border-radius:9px;background:#321b1b;color:#ffb5b5;font-size:13px;animation:mtFadeDown .25s ease}
.hidden{display:none!important}
/* Loading spinner shown on buttons while a request is in flight */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #1113;border-top-color:#111;border-radius:50%;vertical-align:-3px;margin-right:8px;animation:mtSpin .7s linear infinite}
.google .spinner{border:2px solid #fff3;border-top-color:#fff}
@keyframes mtSpin{to{transform:rotate(360deg)}}
@keyframes mtCardIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes mtFadeDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<main class="auth-wrap">
<section class="card">
  <div class="brand"><img src="mytube-logo.jpg" alt="D Player"></div>
  <h1 id="title">Sign in to D Player</h1>
  <p class="sub" id="subtitle">Use your email and password to continue</p>
  <div id="msg" class="msg"></div>

  <form id="passwordForm">
    <label for="email">Email</label>
    <div class="field"><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
    <label for="password">Password</label>
    <div class="field">
      <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
      <button class="toggle" type="button" data-target="password" aria-label="Show password">◉</button>
    </div>
    <button id="loginBtn" type="submit">Sign in</button>
  </form>

  <div class="divider">OR</div>
  <button id="googleBtn" class="google" type="button">Continue with Google</button>

  <p class="switch">Don't have an account? <a href="/signup.html">Create account</a></p>
  <a class="back" href="/">← Back to D Player</a>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const msg=$('msg');
function showMsg(t){msg.textContent=t;msg.style.display='block'}
function clearMsg(){msg.textContent='';msg.style.display='none'}
async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.error||d.message||'Request failed.');
  return d;
}
document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{
  const i=$(b.dataset.target),show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'◉':'◌';b.setAttribute('aria-label',show?'Hide password':'Show password');
});
$('passwordForm').onsubmit=async e=>{
  e.preventDefault();clearMsg();const btn=$('loginBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Signing in…';
  try{const d=await post('/api/auth/login',{email:$('email').value.trim(),password:$('password').value});location.href=d.redirect||'/';}
  catch(e){showMsg(e.message);btn.disabled=false;btn.textContent='Sign in'}
};
$('googleBtn').onclick=()=>{
  const btn=$('googleBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Redirecting…';
  location.href='/auth/google';
};
</script>
</body>
</html>
