<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Change password • D Player</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#0f0f0f;color:#fff}
    body{display:flex;align-items:center;justify-content:center;padding:24px}
    .wrap{width:100%;max-width:440px}
    .card{background:#181818;border:1px solid #2b2b2b;border-radius:18px;padding:30px;box-shadow:0 18px 60px #0008}
    .brand{display:flex;justify-content:center;align-items:center;min-height:54px;margin-bottom:14px}
    .brand img{max-width:190px;max-height:58px;object-fit:contain}
    h1{text-align:center;font-size:24px;margin:8px 0 6px}
    .sub{text-align:center;color:#aaa;font-size:14px;margin:0 0 24px}
    .email{text-align:center;color:#aaa;font-size:13px;margin:-8px 0 22px;word-break:break-word}
    label{display:block;font-size:13px;color:#ddd;margin-bottom:7px}
    .pw{position:relative;margin-bottom:16px}
    .pw input{margin:0;padding-right:48px}
    .eye{position:absolute;right:4px;top:4px;width:40px;height:40px;background:transparent;color:#aaa;border:0;padding:0;font-size:17px}
    .eye:hover{background:transparent;color:#fff}
    input{width:100%;height:48px;border:1px solid #444;background:#0f0f0f;color:#fff;border-radius:10px;padding:0 13px;font-size:15px;outline:0;margin-bottom:16px}
    input:focus{border-color:#aaa}
    button.primary{width:100%;height:48px;border:0;border-radius:10px;background:#fff;color:#111;font-size:15px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .msg{display:none;margin-bottom:15px;padding:10px 12px;border-radius:9px;background:#321b1b;color:#ffb5b5;font-size:13px;line-height:1.4}
    .msg.success{background:#17321f;color:#a9f0bb}
    .back{display:block;text-align:center;color:#888;font-size:13px;font-weight:400;margin-top:20px;text-decoration:none}
    .hint{color:#888;font-size:12px;margin:-7px 0 16px;line-height:1.4}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="brand">
        <img src="mytube-logo.jpg" alt="D Player">
      </div>

      <h1>Change your password</h1>
      <p class="sub">Enter your current password and choose a new one.</p>

      <div id="accountEmail" class="email"></div>
      <div id="msg" class="msg"></div>

      <form id="changeForm">
        <label for="current">Current password</label>
        <div class="pw">
          <input id="current" type="password" autocomplete="current-password" required>
          <button class="eye" type="button" data-target="current" aria-label="Show password">◉</button>
        </div>

        <label for="newPassword">New password</label>
        <div class="pw">
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
          <button class="eye" type="button" data-target="newPassword" aria-label="Show password">◉</button>
        </div>
        <div class="hint">Use at least 8 characters.</div>

        <label for="confirm">Confirm new password</label>
        <div class="pw">
          <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
          <button class="eye" type="button" data-target="confirm" aria-label="Show password">◉</button>
        </div>

        <button id="changeBtn" class="primary" type="submit">Change password</button>
      </form>

      <a class="back" href="/">← Back to D Player</a>
    </section>
  </main>

  <script>
    const form=document.getElementById('changeForm');
    const msg=document.getElementById('msg');
    const btn=document.getElementById('changeBtn');
    const current=document.getElementById('current');
    const newPassword=document.getElementById('newPassword');
    const confirm=document.getElementById('confirm');
    const accountEmail=document.getElementById('accountEmail');

    function showMessage(text,success=false){
      msg.textContent=text;
      msg.className=success?'msg success':'msg';
      msg.style.display='block';
    }

    async function loadAccount(){
      try{
        const r=await fetch('/api/auth/me',{credentials:'include'});
        const d=await r.json().catch(()=>({}));
        if(!r.ok || !d.signedIn){
          location.href='/login.html';
          return;
        }
        if(d.email)accountEmail.textContent=d.email;
      }catch(_){
        location.href='/login.html';
      }
    }

    form.onsubmit=async e=>{
      e.preventDefault();
      msg.style.display='none';

      if(newPassword.value.length<8){
        showMessage('New password must be at least 8 characters.');
        return;
      }
      if(newPassword.value!==confirm.value){
        showMessage('New passwords do not match.');
        return;
      }
      if(current.value===newPassword.value){
        showMessage('New password must be different from your current password.');
        return;
      }

      btn.disabled=true;
      btn.textContent='Changing password…';

      try{
        const r=await fetch('/api/auth/change-password',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          credentials:'include',
          body:JSON.stringify({
            currentPassword:current.value,
            newPassword:newPassword.value
          })
        });
        const d=await r.json().catch(()=>({}));

        if(!r.ok){
          if(r.status===401 && /signed in|current password/i.test(d.error||'')){
            showMessage(d.error||'Current password is incorrect.');
          }else{
            throw new Error(d.error||d.message||'Unable to change password.');
          }
          return;
        }

        showMessage('Password changed successfully.',true);
        current.value='';
        newPassword.value='';
        confirm.value='';

        setTimeout(()=>location.href='/',900);
      }catch(e){
        showMessage(e.message||'Unable to change password.');
      }finally{
        btn.disabled=false;
        btn.textContent='Change password';
      }
    };

    document.querySelectorAll('.eye').forEach(button=>{
      button.onclick=()=>{
        const input=document.getElementById(button.dataset.target);
        const show=input.type==='password';
        input.type=show?'text':'password';
        button.textContent=show?'◉':'◌';
        button.setAttribute('aria-label',show?'Hide password':'Show password');
      };
    });

    loadAccount();
  </script>
</body>
</html>
