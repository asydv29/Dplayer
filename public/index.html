<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>D Player</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="home-page">
<header class="home-topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  <a class="home-brand" href="/" aria-label="D Player home">
    <img class="brand-logo" src="/mytube-logo.jpg" alt="D Player">
  </a>

  <form class="home-search" id="searchForm">
    <input id="search" autocomplete="off" placeholder="Search" aria-label="Search videos">
    <button type="submit" aria-label="Search">⌕</button>
  </form>

  <nav class="home-actions" aria-label="Home actions">
    <a class="home-action" href="/?list=liked" aria-label="Liked videos">
      <span class="home-action-icon like-icon"><svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></span><span>Liked</span>
    </a>
    <a class="home-action" href="/?list=favorites" aria-label="Favorite videos">
      <span class="home-action-icon fav-icon"></span><span>Favorites</span>
    </a>
    <button class="avatar" id="avatarBtn" aria-label="Account">A</button>
    <button class="create-btn home-hidden-action" id="createBtn" type="button">＋ Create</button>
    <button class="icon-btn home-hidden-action" id="bellBtn" aria-label="Notifications">♧</button>
  </nav>
</header>

<div class="home-layout">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <img class="brand-logo sidebar-logo" src="/mytube-logo.jpg" alt="">
      <span class="sidebar-title">D Player</span>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close menu">×</button>
    </div>
    <a class="side-item active" href="/" data-nav="home">
      <span class="side-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3 10.5V21a1 1 0 0 0 1 1h5.5a.75.75 0 0 0 .75-.75V15.5a1.75 1.75 0 0 1 3.5 0v5.75c0 .414.336.75.75.75H20a1 1 0 0 0 1-1V10.5L12 3.2Z"/></svg></span>
      <span>Home</span>
    </a>
    <button class="side-item" data-view="shorts" data-nav="shorts">
      <span class="side-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.9 2 5 13h5l-1 9 8-12h-5l3.9-8Z"/></svg></span>
      <span>Shorts</span>
    </button>
    <a class="side-item" href="/?list=liked" data-nav="liked">
      <span class="side-icon like-icon side-like"><svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></span>
      <span>Liked Video</span>
    </a>
    <a class="side-item" href="/?list=liked&view=shorts" data-nav="liked-shorts">
      <span class="side-icon like-icon side-like"><svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></span>
      <span>Liked Short</span>
    </a>
    <a class="side-item" href="/?list=favorites" data-nav="favorites">
      <span class="side-icon fav-icon side-fav-icon"></span>
      <span>Favorites</span>
    </a>
    <button class="side-item" data-view="history" data-nav="history">
      <span class="side-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 1 0 8.94 10h-2.02A7 7 0 1 1 13 5c1.66 0 3.14.63 4.28 1.66L14 10h7V3l-2.35 2.35A8.98 8.98 0 0 0 13 3Z"/><path d="M12 8v5l4 2-.75 1.3L11 13.5V8Z"/></svg></span>
      <span>History</span>
    </button>
    <div class="side-divider"></div>
    <div class="side-title">Folders</div>
    <div id="folderTree" class="folder-tree"><div class="side-small">Loading folders…</div></div>
    <div class="side-divider"></div>
    <div class="side-title">You</div>
    <button class="side-item" id="profileBtn">
      <span class="side-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.76-3.58-5-8-5Z"/></svg></span>
      <span>Your profile</span>
    </button>
    <a class="side-item" href="/change-password.html">
      <span class="side-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 0 0-5 5v3H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Zm3 3a1.75 1.75 0 0 1 1 3.18V18a1 1 0 1 1-2 0v-1.82A1.75 1.75 0 0 1 12 13Z"/></svg></span>
      <span>Change password</span>
    </a>
    <a class="side-item" href="/?list=favorites">
      <span class="side-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h11v2H4V5Zm0 4.5h11v2H4v-2ZM4 13h7v2H4v-2Zm13-1v8l6-4-6-4Z"/></svg></span>
      <span>Saved videos</span>
    </a>
    <div class="side-divider"></div>
    <div class="side-small" id="accountStatus">Checking account…</div>
    <a class="side-signout" href="/logout">Sign out</a>
  </aside>

  <main class="home-content">
    <section class="home-section">
      <div id="folderHeader" class="folder-header" hidden>
        <h1 id="folderHeaderTitle"></h1>
        <a class="folder-clear" href="/">✕ Clear</a>
      </div>
      <div id="selectBar" class="select-bar"></div>
      <div id="grid" class="video-grid"></div>
    </section>
  </main>
</div>

<input id="thumbnailInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
<div class="toast" id="toast"></div>
<div class="modal" id="modal">
  <div class="modal-card">
    <button class="modal-close" id="modalClose">×</button>
    <h2 id="modalTitle">D Player</h2>
    <p id="modalText"></p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<nav class="home-bottom-nav" id="homeBottomNav" aria-label="Primary">
  <a class="home-bnav-item" href="/" data-bnav="home">
    <span class="home-bnav-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3 10.5V21a1 1 0 0 0 1 1h5.5a.75.75 0 0 0 .75-.75V15.5a1.75 1.75 0 0 1 3.5 0v5.75c0 .414.336.75.75.75H20a1 1 0 0 0 1-1V10.5L12 3.2Z"/></svg></span>
    <span>Home</span>
  </a>
  <a class="home-bnav-item" href="/shorts.html">
    <span class="home-bnav-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.9 2 5 13h5l-1 9 8-12h-5l3.9-8Z"/></svg></span>
    <span>Shorts</span>
  </a>
  <a class="home-bnav-item" href="/?view=history" data-bnav="history">
    <span class="home-bnav-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 1 0 8.94 10h-2.02A7 7 0 1 1 13 5c1.66 0 3.14.63 4.28 1.66L14 10h7V3l-2.35 2.35A8.98 8.98 0 0 0 13 3Z"/><path d="M12 8v5l4 2-.75 1.3L11 13.5V8Z"/></svg></span>
    <span>History</span>
  </a>
  <button class="home-bnav-item" id="bnavProfileBtn" type="button">
    <span class="home-bnav-avatar" id="bnavAvatar">A</span>
    <span>You</span>
  </button>
</nav>
<script src="/app.js"></script>
</body>
</html>
