<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign out • D Player</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f0f0f;color:#fff;font-family:Arial}.card{width:min(420px,calc(100% - 32px));padding:28px;background:#181818;border:1px solid #2b2b2b;border-radius:16px;text-align:center}button{border:0;border-radius:10px;padding:13px 22px;font-weight:700;cursor:pointer}.out{background:#fff}.cancel{background:#333;color:#fff;margin-left:8px}</style></head><body><div class="card"><h2>Sign out of D Player?</h2><p>You can sign in again anytime.</p><button class="out" onclick="signout()">Sign out</button> <button class="cancel" onclick="history.back()">Cancel</button></div><script>async function signout(){try{await fetch('/api/auth/logout',{method:'POST',credentials:'include'})}finally{location.href='/login.html'}}</script></body></html>
